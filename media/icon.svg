<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b23a0e"/>
      <stop offset="38%" stop-color="#f47a14"/>
      <stop offset="66%" stop-color="#ffb52b"/>
      <stop offset="100%" stop-color="#ffd255"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6cf"/>
      <stop offset="52%" stop-color="#ffd84e"/>
      <stop offset="100%" stop-color="#ffb52b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="40%" r="80%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1c0a04" stop-opacity="0.38"/>
    </radialGradient>
    <clipPath id="clip"><rect x="4" y="4" width="120" height="120" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#sky)"/>
    <circle cx="64" cy="54" r="40" fill="url(#sun)"/>

    <!-- cowboy hat silhouette: wide curled brim + tall cattleman crown w/ dent -->
    <g fill="#1a0a06">
      <path d="M18 70 C30 64 48 62 64 62 C80 62 98 64 110 70
               C98 75 80 77 64 77 C48 77 30 75 18 70 Z"/>
      <path d="M46 70 L47 49 C47 41 53 36 56 36 C58 41 70 41 72 36
               C75 36 81 41 81 49 L82 70 Z"/>
    </g>
    <!-- hat band -->
    <path d="M47 62 C55 60 73 60 81 62 L80.5 67 C73 65 55 65 47.5 67 Z" fill="#c8420f"/>

    <!-- kanban board strip -->
    <rect x="4" y="84" width="120" height="40" fill="#3a1308"/>
    <rect x="4" y="84" width="120" height="3" fill="#5a1e0b"/>
    <rect x="14" y="91" width="30" height="6" rx="2" fill="#ffce7a"/>
    <rect x="14" y="100" width="30" height="6" rx="2" fill="#f0b066"/>
    <rect x="49" y="91" width="30" height="6" rx="2" fill="#ffce7a"/>
    <rect x="84" y="91" width="30" height="6" rx="2" fill="#ffce7a"/>
    <rect x="84" y="100" width="30" height="6" rx="2" fill="#f0b066"/>
    <rect x="84" y="109" width="30" height="6" rx="2" fill="#d98c46"/>

    <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#vig)"/>
  </g>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="#1c0b08" stroke-width="2"/>
</svg>
