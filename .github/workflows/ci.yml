name: PR CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, compile, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Authenticate to GitHub Packages
        shell: bash
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [[ -z "$GH_PACKAGES_TOKEN" ]]; then
            echo "::error::Repository secret GH_PACKAGES_TOKEN is not configured."
            exit 1
          fi
          printf '%s\n' "//npm.pkg.github.com/:_authToken=$GH_PACKAGES_TOKEN" >> .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile extension
        run: npm run compile

      - name: Compile tests
        run: npm run compile-tests

      - name: Run tests
        run: npm test
