name: Release extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches extension version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          manifest_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$manifest_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $manifest_version."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Compile tests
        run: npm run compile-tests

      - name: Compile extension
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Package VSIX
        run: npm run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: mwnn-kanban-${{ github.sha }}
          path: mwnn-kanban.vsix
          if-no-files-found: error

  publish-vs-marketplace:
    name: Publish to VS Marketplace
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: mwnn-kanban-${{ github.sha }}

      - name: Publish VSIX
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "::error::Repository secret VSCE_PAT is not configured."
            exit 1
          fi
          npx --yes @vscode/vsce publish --packagePath mwnn-kanban.vsix -p "$VSCE_PAT"

  publish-open-vsx:
    name: Publish to Open VSX
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: mwnn-kanban-${{ github.sha }}

      - name: Publish VSIX
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [[ -z "$OVSX_PAT" ]]; then
            echo "::error::Repository secret OVSX_PAT is not configured."
            exit 1
          fi
          npx --yes ovsx publish mwnn-kanban.vsix -p "$OVSX_PAT"
